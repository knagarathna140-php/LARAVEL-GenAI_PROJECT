services:
  app:
    build: .
    ports:
      - "8000:8000"
    volumes:
      - .:/app
    # Optional: copy .env.example to .env and add your AI key there.
    # Without a .env file the container creates one from .env.example.
    env_file:
      - path: .env
        required: false
    depends_on:
      - db
      - redis

  db:
    image: postgres:16
    environment:
      POSTGRES_DB: erp
      POSTGRES_USER: erp
      POSTGRES_PASSWORD: secret
    volumes:
      - dbdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine

volumes:
  dbdata:
